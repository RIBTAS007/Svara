<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_73 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_73" style="display:block;"><svg fill="none" height="100%" viewbox="0 0 900 500" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Gradients -->
<lineargradient id="waveGrad1" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00D2FF" stop-opacity="0.85"></stop>
<stop offset="50%" stop-color="#0066CC" stop-opacity="0.75"></stop>
<stop offset="100%" stop-color="#9945FF" stop-opacity="0.9"></stop>
</lineargradient>
<lineargradient id="waveGrad2" x1="100%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FF3B81" stop-opacity="0.7"></stop>
<stop offset="50%" stop-color="#7928CA" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#0066CC" stop-opacity="0.8"></stop>
</lineargradient>
<lineargradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"></stop>
<stop offset="50%" stop-color="#7928CA" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#FF3B81" stop-opacity="0.15"></stop>
</lineargradient>
<!-- Filters for Bloom/Glow -->
<filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="14"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<style>
    @keyframes pulseAcoustic {
      0%, 100% { transform: scaleY(0.4) scaleX(0.98); opacity: 0.55; }
      50% { transform: scaleY(1.1) scaleX(1.02); opacity: 0.95; }
    }
    @keyframes pulseAcoustic2 {
      0%, 100% { transform: scaleY(1.05) translateY(-5px); opacity: 0.9; }
      50% { transform: scaleY(0.5) translateY(5px); opacity: 0.45; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes morphPath1 {
      0%, 100% {
        d: path("M 50 250 C 150 180, 250 320, 380 230 C 470 170, 560 310, 680 220 C 760 160, 820 280, 850 250");
      }
      50% {
        d: path("M 50 250 C 140 310, 260 170, 380 270 C 480 340, 570 180, 670 280 C 750 340, 810 210, 850 250");
      }
    }
    @keyframes morphPath2 {
      0%, 100% {
        d: path("M 80 250 C 180 300, 280 180, 420 280 C 520 350, 620 180, 720 270 C 790 320, 830 220, 850 250");
      }
      50% {
        d: path("M 80 250 C 170 190, 290 330, 430 210 C 530 140, 630 310, 730 220 C 780 170, 820 270, 850 250");
      }
    }
    @keyframes soundBar {
      0%, 100% { height: 18px; transform: translateY(0); }
      50% { height: 75px; transform: translateY(-28px); }
    }
    @keyframes particleStream {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% { transform: translate(180px, -45px); opacity: 0; }
    }
    @keyframes textStreamGlow {
      0%, 100% { opacity: 0.35; stroke-dashoffset: 0; }
      50% { opacity: 0.85; stroke-dashoffset: -40; }
    }
  </style>
<!-- Ambient background glow aura -->
<ellipse cx="450" cy="250" fill="url(#glowGrad)" filter="url(#softGlow)" rx="360" ry="140"></ellipse>
<!-- Flowing Voice / Sound Waves (Harmonic S curves) -->
<g filter="url(#softGlow)" opacity="0.85" style="transform-origin: center; animation: floatWave 7s ease-in-out infinite;">
<!-- Wave 1 (Cyan to Magenta) -->
<path class="wave-line-1" d="M 50 250 C 150 180, 250 320, 380 230 C 470 170, 560 310, 680 220 C 760 160, 820 280, 850 250" fill="none" stroke="url(#waveGrad1)" stroke-linecap="round" stroke-width="4.5" style="animation: morphPath1 6s ease-in-out infinite;"></path>
<!-- Wave 2 (Rose to Blue) -->
<path class="wave-line-2" d="M 80 250 C 180 300, 280 180, 420 280 C 520 350, 620 180, 720 270 C 790 320, 830 220, 850 250" fill="none" stroke="url(#waveGrad2)" stroke-dasharray="8 4" stroke-linecap="round" stroke-width="4" style="animation: morphPath2 7.5s ease-in-out infinite; animation-delay: -1s;"></path>
<!-- Secondary Harmonic Echo Wave -->
<path d="M 100 250 C 200 160, 300 340, 440 220 C 540 160, 640 330, 740 210 C 800 150, 830 290, 850 250" fill="none" stroke="#00D2FF" stroke-linecap="round" stroke-opacity="0.4" stroke-width="2" style="animation: morphPath1 8.5s ease-in-out infinite; animation-delay: -2s;"></path>
</g>
<!-- Central Acoustic Spectrum (Soundwave transforming into linguistic tokens / text) -->
<g transform="translate(450, 250)">
<!-- Central S-shaped harmonic sound logo core -->
<circle cx="0" cy="0" fill="#0c1021" opacity="0.9" r="48" stroke="url(#waveGrad1)" stroke-width="2"></circle>
<path d="M -16 -12 C -8 -26, 12 -22, 16 -12 C 19 -1, 5 8, -2 14 C -12 21, -6 32, 8 30 C 16 29, 20 23, 20 23" fill="none" stroke="url(#waveGrad1)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5" style="filter: drop-shadow(0 0 8px #00D2FF);"></path>
<!-- Acoustic equalizer bars pulsing on sides -->
<!-- Left Equalizer bars (Audio Speech Input) -->
<g transform="translate(-160, 0)">
<rect fill="#00D2FF" height="24" rx="2" style="animation: pulseAcoustic 1.2s ease-in-out infinite; transform-origin: center;" width="4" x="-70" y="-12"></rect>
<rect fill="#00B4D8" height="44" rx="2" style="animation: pulseAcoustic2 1.4s ease-in-out infinite 0.1s; transform-origin: center;" width="4" x="-56" y="-22"></rect>
<rect fill="#0096C7" height="70" rx="2" style="animation: pulseAcoustic 1.1s ease-in-out infinite 0.25s; transform-origin: center;" width="4" x="-42" y="-35"></rect>
<rect fill="#0077B6" height="96" rx="2" style="animation: pulseAcoustic2 1.5s ease-in-out infinite 0.4s; transform-origin: center;" width="4" x="-28" y="-48"></rect>
<rect fill="#023E8A" height="56" rx="2" style="animation: pulseAcoustic 1.3s ease-in-out infinite 0.15s; transform-origin: center;" width="4" x="-14" y="-28"></rect>
</g>
<!-- Right Structured Text & Token Stream (Transcribed Output Representation) -->
<g transform="translate(110, 0)">
<!-- Digital transcription token brackets & signal rays -->
<g style="animation: textStreamGlow 3s ease-in-out infinite;">
<!-- Line 1: Word token preview -->
<rect fill="#7928CA" height="9" opacity="0.85" rx="4.5" width="60" x="15" y="-32"></rect>
<rect fill="#0066CC" height="9" opacity="0.75" rx="4.5" width="95" x="85" y="-32"></rect>
<circle cx="192" cy="-27.5" fill="#00D2FF" r="3.5"></circle>
<!-- Line 2: Active transcribed token with cursor -->
<rect fill="url(#waveGrad1)" height="11" rx="5.5" width="80" x="15" y="-10"></rect>
<rect fill="#9945FF" height="11" opacity="0.9" rx="5.5" width="110" x="105" y="-10"></rect>
<line stroke="#FF3B81" stroke-linecap="round" stroke-width="3" x1="222" x2="222" y1="-14" y2="5">
<animate attributename="opacity" dur="0.9s" repeatcount="indefinite" values="1;0;1"></animate>
</line>
<!-- Line 3: Text confidence/waveform stream -->
<rect fill="#0066CC" height="8" opacity="0.6" rx="4" width="115" x="15" y="15"></rect>
<rect fill="#00D2FF" height="8" opacity="0.5" rx="4" width="55" x="140" y="15"></rect>
</g>
</g>
</g>
<!-- Floating acoustic particle sparks representing speech phonemes transitioning to text -->
<g filter="url(#softGlow)">
<circle cx="280" cy="180" fill="#00D2FF" r="3" style="animation: particleStream 3.5s linear infinite;"></circle>
<circle cx="330" cy="310" fill="#FF3B81" r="2.5" style="animation: particleStream 4.2s linear infinite 0.8s;"></circle>
<circle cx="390" cy="160" fill="#9945FF" r="3.5" style="animation: particleStream 3.8s linear infinite 1.4s;"></circle>
<circle cx="510" cy="320" fill="#00D2FF" r="2.8" style="animation: particleStream 4.0s linear infinite 0.3s;"></circle>
<circle cx="580" cy="170" fill="#7928CA" r="3" style="animation: particleStream 3.6s linear infinite 1.9s;"></circle>
<circle cx="650" cy="290" fill="#FF3B81" r="2" style="animation: particleStream 4.5s linear infinite 1.1s;"></circle>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_73 -->
</body>
</html>
