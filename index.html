<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Svara</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="mark"></span> Svara</div>
      <div class="crumb">
        <strong id="title">Landing page</strong>
        <span id="path">P01 · /public</span>
      </div>
      <div class="actions">
        <button id="back" type="button">Back</button>
        <label class="zoom">Zoom <input id="zoom" type="range" min="0.45" max="1" step="0.05" value="0.72"></label>
        <button id="next" class="primary" type="button">Next</button>
      </div>
    </header>
    <aside class="sidebar" id="nav"></aside>
    <main class="stage">
      <iframe id="screen" title="Svara screen"></iframe>
      <article id="document" class="doc" hidden></article>
      <div class="toast" id="toast"></div>
    </main>
  </div>
  <script src="marked.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
